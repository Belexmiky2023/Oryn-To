
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oryn Server | Editor Tournament</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #000;
        color: #fff;
        font-family: 'Space Grotesk', sans-serif;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, .font-raj {
        font-family: 'Rajdhani', sans-serif;
      }
      .neon-glow {
        text-shadow: 0 0 10px rgba(57, 255, 20, 0.7), 0 0 20px rgba(57, 255, 20, 0.4);
      }
      .neon-border {
        border: 1px solid rgba(57, 255, 20, 0.3);
        box-shadow: 0 0 15px rgba(57, 255, 20, 0.1);
      }
      .glass-morphism {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .neon-button {
        background: transparent;
        border: 1px solid #39FF14;
        color: #39FF14;
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        position: relative;
        overflow: hidden;
      }
      .neon-button:hover {
        background: #39FF14;
        color: #000;
        box-shadow: 0 0 30px rgba(57, 255, 20, 0.7);
        transform: translateY(-2px);
      }
      .animate-pulse-slow {
        animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      .glow-pulse {
        animation: glowPulse 2s infinite;
      }
      @keyframes glowPulse {
        0% { box-shadow: 0 0 5px rgba(57, 255, 20, 0.2); }
        50% { box-shadow: 0 0 20px rgba(57, 255, 20, 0.5); }
        100% { box-shadow: 0 0 5px rgba(57, 255, 20, 0.2); }
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: #111;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #39FF14;
      }
    </style>

}
</script>
</head>

  </body>
</html>
