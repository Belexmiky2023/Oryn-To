<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oryn Server | Editor Tournament</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Identity -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
      body {
        background-color: #000;
        color: #fff;
        font-family: 'Space Grotesk', sans-serif;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, .font-raj {
        font-family: 'Rajdhani', sans-serif;
      }
      .scanline {
        position: fixed;
        inset: 0;
        background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.1) 51%);
        background-size: 100% 4px;
        pointer-events: none;
        opacity: 0.1;
        z-index: 50;
      }
      .neon-glow {
        text-shadow: 0 0 10px rgba(57, 255, 20, 0.7), 0 0 20px rgba(57, 255, 20, 0.4);
      }
      .glass-morphism {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .neon-button {
        background: transparent;
        border: 1px solid #39FF14;
        color: #39FF14;
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        position: relative;
        overflow: hidden;
      }
      .neon-button:hover {
        background: #39FF14;
        color: #000;
        box-shadow: 0 0 30px rgba(57, 255, 20, 0.7);
        transform: translateY(-2px);
      }
      @keyframes pulse-slow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      .animate-pulse-slow {
        animation: pulse-slow 3s infinite;
      }
      
      /* New Vote Confirmation Animations */
      @keyframes vote-success-glow {
        0% { box-shadow: 0 0 5px rgba(57, 255, 20, 0.4); border-color: rgba(57, 255, 20, 0.4); }
        50% { box-shadow: 0 0 40px rgba(57, 255, 20, 0.8); border-color: rgba(57, 255, 20, 1); }
        100% { box-shadow: 0 0 5px rgba(57, 255, 20, 0.4); border-color: rgba(57, 255, 20, 0.4); }
      }
      .animate-vote-success {
        animation: vote-success-glow 2s infinite ease-in-out;
      }

      @keyframes slide-beam {
        0% { transform: translateX(-100%) skewX(-15deg); }
        100% { transform: translateX(200%) skewX(-15deg); }
      }
      .success-beam {
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 100%;
        background: linear-gradient(to right, transparent, rgba(57, 255, 20, 0.2), transparent);
        animation: slide-beam 3s infinite linear;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
  <body>
    <div class="scanline"></div>
    <div id="root"></div>
    <!-- Vite entry point -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
