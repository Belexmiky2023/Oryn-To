
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oryn Server | Elite Editor Tournament 2025</title>
    <meta name="description" content="The ultimate stage for motion designers and video editors. Vote for your champion in the Oryn Cup.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --neon-green: #39FF14;
      }
      body {
        background-color: #000;
        color: #fff;
        font-family: 'Space Grotesk', sans-serif;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, .font-raj {
        font-family: 'Rajdhani', sans-serif;
      }
      .scanline {
        position: fixed;
        inset: 0;
        background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.05) 51%);
        background-size: 100% 4px;
        pointer-events: none;
        opacity: 0.15;
        z-index: 9999;
      }
      .neon-glow {
        text-shadow: 0 0 10px rgba(57, 255, 20, 0.7), 0 0 20px rgba(57, 255, 20, 0.4);
      }
      .glass-morphism {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .neon-button {
        background: transparent;
        border: 1px solid var(--neon-green);
        color: var(--neon-green);
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        position: relative;
        overflow: hidden;
      }
      .neon-button:hover {
        background: var(--neon-green);
        color: #000;
        box-shadow: 0 0 30px rgba(57, 255, 20, 0.8);
        transform: translateY(-2px);
      }
      .github-button {
        background: #24292e;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        transition: all 0.3s ease;
      }
      .github-button:hover {
        background: #fff;
        color: #000;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      }
      @keyframes glow-pulse-anim {
        0% { box-shadow: 0 0 5px rgba(57, 255, 20, 0.2); }
        50% { box-shadow: 0 0 20px rgba(57, 255, 20, 0.5); }
        100% { box-shadow: 0 0 5px rgba(57, 255, 20, 0.2); }
      }
      
      @keyframes slide-beam {
        0% { transform: translateX(-100%) skewX(-15deg); }
        100% { transform: translateX(200%) skewX(-15deg); }
      }
      .success-beam {
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 100%;
        background: linear-gradient(to right, transparent, rgba(57, 255, 20, 0.2), transparent);
        animation: slide-beam 3s infinite linear;
      }
    </style>
    
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.1",
    "magic-sdk": "https://esm.sh/magic-sdk@28.0.0",
    "@magic-ext/oauth": "https://esm.sh/@magic-ext/oauth@18.0.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  </head>
  <body>
    <div class="scanline"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
